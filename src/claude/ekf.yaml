# Velocity-based EKF Configuration
# State: [vx, vy, r, bg, bax, bay] - 6 DOF

# Topic Configuration
imu_topic: "/imu"
joint_states_topic: "/qcar/joint_states"
steering_topic: "/steering/angle"  # Optional - if not available, will use zero
odom_topic: "/qcar/ekf/odom_body"

# Frame Configuration
odom_frame: "odom"
base_frame: "base_link"
publish_tf: false  # Usually false for velocity-only EKF

# Drive wheel joint names (for speed measurement)
drive_wheel_joints: ["wheelfl_motor", "wheelfr_motor"]

# Initial State (velocities, biases start at zero)
init_vx: 0.0    # Initial forward velocity (m/s)
init_vy: 0.0    # Initial lateral velocity (m/s)
init_r: 0.0     # Initial yaw rate (rad/s)

# Process Noise (continuous-time standard deviations for [vx, vy, r, bg, bax, bay])
q: [2.0, 2.0, 1.0, 0.001, 0.01, 0.01]
# vx, vy: Velocity process noise (m/s/√Hz)
# r: Yaw rate process noise (rad/s/√Hz)  
# bg: Gyro bias random walk (rad/s/√Hz)
# bax, bay: Accel bias random walks (m/s²/√Hz)

# Measurement Noise (standard deviations)
gyro_std: 0.01    # Gyro measurement noise (rad/s)
speed_std: 0.01   # Speed measurement noise (m/s)

# Vehicle Parameters
wheelbase: 0.258  # QCar wheelbase (m)
rw: 0.033        # Wheel radius (m)
dtMaxEst: 0.01   # Maximum allowed dt for integration (s)

# Accelerometer Configuration
gravity_mode: "off"         # "off", "startup_avg", or "complementary"
startup_calib_time: 2.5     # Time for startup gravity calibration (s)
imu_lpf_hz: 15.0           # Low-pass filter cutoff for accelerometer (Hz)

# Odometry Buffer (for deskewing)
odom_buffer_size: 200      # ~2 seconds at 100 Hz

# NHC (No Horizontal Coupling) Pseudo-Measurement
nhc_enable: true
nhc_velocity_threshold: 1.0    # Minimum |vx| to apply NHC (m/s)
nhc_base_std: 0.05            # Base lateral velocity std (m/s)
nhc_scaling_factor: 1.0       # Scaling for |r*vx| adaptive term

# ZUPT (Zero Velocity Update) Pseudo-Measurement  
zupt_enable: true
zupt_velocity_threshold: 0.1   # Max |vx| for stationary detection (m/s)
zupt_gyro_threshold: 0.05     # Max |gyro_z| for stationary detection (rad/s)
zupt_min_duration: 0.3        # Min time stationary before applying ZUPT (s)
zupt_velocity_std: 0.01       # Velocity measurement std during ZUPT (m/s)
zupt_yaw_rate_std: 0.01       # Yaw rate measurement std during ZUPT (rad/s)