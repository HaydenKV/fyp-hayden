# config/jmf.yaml
# ==============================================
# Per-mode parameter sets for Jump Markov Filter
# ==============================================
model_length: 0.258

mode_params:
  # 0: Healthy mode — extremely tight Q & R so it dominates when no fault
  healthy:
    L:   0.258
    q:   [!!float 1e-6, !!float 1e-6, !!float 1e-6, !!float 1e-9, !!float 1e-9, !!float 1e-9]
    R_imu: [0.1,   0.00,   0.00,   0.1]     # very confident in IMU under healthy
    R_vel: [0.05,  0.00,   0.00,   0.05]    # very confident in velocity
    R_pos: [0.001, 0.00,   0.00,   0.001]   # very confident in position

  # 1: Motor fault — huge process noise on speed, downweight velocity updates
  motor_fault:
    L:   0.258
    q:   [!!float 2.0, !!float 2.0, !!float 1e-6, !!float 1e-9, !!float 1e-9, !!float 1e-9]
    R_imu: [0.5,  0.00,   0.00,   0.5]
    R_vel: [50.0,   0.00,   0.00,   50.0 ]    # very uncertain about velocity
    R_pos: [0.05, 0.00,   0.00,   0.05]

  # 2: Steering fault — huge process noise on yaw‐rate, downweight IMU‐based yaw updates
  steering_fault:
    L:   0.258
    q:   [!!float 1e-6, !!float 1e-6, !!float 2.0, !!float 1e-9, !!float 1e-9, !!float 1e-9]
    R_imu: [0.5,  0.00,   0.00,   0.5]    # less trust in IMU yaw measurement
    R_vel: [0.1,  0.00,   0.00,   0.1]
    R_pos: [0.05, 0.00,   0.00,   0.05]

  # 3: IMU fault — huge process noise on accel bias, ignore IMU updates
  imu_fault:
    L:   0.258
    q:   [!!float 1e-6, !!float 1e-6, !!float 1e-6, !!float 0.5, !!float 1e-9, !!float 1e-9]
    R_imu: [100.0,  0.00,   0.00,   100.0]   # virtually ignore accelerometer
    R_vel: [0.1,  0.00,   0.00,   0.1]
    R_pos: [0.05, 0.00,   0.00,   0.05]

  # 4: Encoder fault — huge process noise on wheel‐bias, ignore odometry velocity
  encoder_fault:
    L:   0.258
    q:   [!!float 1e-6, !!float 1e-6, !!float 1e-6, !!float 1e-9, !!float 0.5, !!float 1e-9]
    R_imu: [0.5,  0.00,   0.00,   0.5]
    R_vel: [100.0,  0.00,   0.00,   100.0]   # virtually ignore wheel‐velocities
    R_pos: [10.0,   0.00,   0.00,   10.0 ]   # very uncertain about odom fallback

# Mode-transition matrix (5×5, row-major)
pi: [
  # from healthy
  # 0.98,  0.005, 0.005, 0.005, 0.005,
  1.00,  0.00,  0.00,  0.00,  0.00,
  # from motor_fault
  # 0.05,  0.90,  0.02,  0.02,  0.01,
  1.00,  0.00,  0.00,  0.00,  0.00,
  # from steering_fault
  # 0.05,  0.02,  0.90,  0.02,  0.01,
  1.00,  0.00,  0.00,  0.00,  0.00,
  # from imu_fault
  # 0.05,  0.02,  0.02,  0.90,  0.01,
  1.00,  0.00,  0.00,  0.00,  0.00,
  # from encoder_fault
  # 0.05,  0.02,  0.02,  0.02,  0.90
  1.00,  0.00,  0.00,  0.00,  0.00,
]

# At what rate (Hz) to publish fused topics
publish_rate: 10.0
