# config/jmf.yaml
# ==============================================
# Per-mode parameter sets for Jump Markov Filter
# ==============================================
model_length: 0.258

mode_params:
  # 0: Healthy mode — extremely tight Q & R so it dominates when no fault
  healthy:
    L: 0.258
    q:     [0.05,   0.05,   0.01,   1e-6, 1e-6, 1e-6]
    R_imu: [0.0025, 0.00,   0.00,   0.001 ]
    R_vel: [0.0002, 0.00,   0.00,   0.0002]

  # 1: Motor fault — huge process noise on speed, downweight velocity updates
  motor_fault:
    L: 0.258
    q:     [1.0,    1.0,    0.01,   1e-6, 1e-6, 1e-6]
    R_imu: [0.1,    0.00,   0.00,   0.05  ]
    R_vel: [20.0,   0.00,   0.00,   20.0  ]

  # 2: Steering fault — huge process noise on yaw‐rate, downweight IMU‐based yaw updates
  steering_fault:
    L: 0.258
    q:     [0.05,   0.05,   0.5,    1e-6, 1e-6, 1e-6]
    R_imu: [0.1,    0.00,   0.00,   0.05  ]
    R_vel: [0.001,  0.00,   0.00,   0.001 ]

  # 3: IMU fault — huge process noise on accel bias, ignore IMU updates
  imu_fault:
    L: 0.258
    q:     [0.05,   0.05,   0.01,   1.0,  1e-6, 1e-6]
    R_imu: [10.0,   0.00,   0.00,   10.0  ]
    R_vel: [0.001,  0.00,   0.00,   0.001 ]

  # 4: Encoder fault — huge process noise on wheel‐bias, ignore odometry velocity
  encoder_fault:
    L: 0.258
    q:     [0.05,   0.05,   0.01,   1e-6, 1.0,  1e-6]
    R_imu: [0.1,    0.00,   0.00,   0.05  ]
    R_vel: [10.0,   0.00,   0.00,   10.0  ]

# Mode-transition matrix (5×5, row-major)
pi: [
  # from healthy
  0.98,  0.005, 0.005, 0.005, 0.005,
  # 1.00,  0.00,  0.00,  0.00,  0.00,
  # from motor_fault
  0.05,  0.90,  0.02,  0.02,  0.01,
  # 1.00,  0.00,  0.00,  0.00,  0.00,
  # from steering_fault
  0.05,  0.02,  0.90,  0.02,  0.01,
  # 1.00,  0.00,  0.00,  0.00,  0.00,
  # from imu_fault
  0.05,  0.02,  0.02,  0.90,  0.01,
  # 1.00,  0.00,  0.00,  0.00,  0.00,
  # from encoder_fault
  0.05,  0.02,  0.02,  0.02,  0.90
  # 1.00,  0.00,  0.00,  0.00,  0.00
]

# At what rate (Hz) to publish fused topics
publish_rate: 10.0
