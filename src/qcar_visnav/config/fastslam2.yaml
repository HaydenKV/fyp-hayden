# ============================
# Lean FastSLAM 2.0 Configuration
# ============================

frames:
  map_frame:   "odom"
  odom_frame:  "odom"
  base_frame:  "base_footprint"
  lidar_frame: "lidar"

odometry:
  use_ekf: false
  truth_topic: "/odom"
  ekf_topic: "/qcar/ekf/odom"

# Initialize particles from params (or snap to first odom if enabled below)
seed_from_params: true
overwrite_with_odom_on_first_msg: false
init:
  x: -4.3
  y: 3.0
  yaw: -3.14
initial_spread:
  x: 0.03
  y: 0.03
  yaw: 0.05
odom_buffer_window_sec: 2.0

# Particle filter
particles: 80
resample_neff_ratio: 0.5

# Constant white process noise (world frame)
motion_noise:
  sigma_x:   0.04
  sigma_y:   0.04
  sigma_yaw: 0.01

# Front-end (choose one)
association:
  mode: "id"          # "id" | "nn_rb"
  chi2_gate_rb: 5.99  # used only when mode == "nn_rb"

# Landmark behavior
landmarks:
  init_var: 0.15          # prior added to J Rz J^T
  confirm_hits: 2         # LM becomes 'confirmed' after this many matched hits
  lock_hits: 6            # OR lock when hits reach this count
  lock_cov_trace: 0.02    # OR lock when trace(Sigma) <= this

# Viz node (optional)
show_confirmed_only: true
map_frame: "odom"
markers_topic: "/slam/map_markers"
