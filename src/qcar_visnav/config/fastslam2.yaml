frames:
  map_frame: "odom"            # run entirely in ODOM
  odom_frame: "odom"
  base_frame: "base_footprint"
  lidar_frame: "lidar"

# --- Initial pose (spawn pose) ---
seed_from_params: true
overwrite_with_odom_on_first_msg: true   # snap to first /odom pose
init:
  x:   -4.3
  y:    3.0
  yaw: -3.14
initial_spread:
  x:   0.05
  y:   0.05
  yaw: 0.02

# /odom twist semantics (Gazebo often provides world-frame twists)
odom_twist_in_world: false      # set true if /odom.twist is world-frame

particles: 120
resample_neff_ratio: 0.4

motion_noise:
  sigma_x:   0.02
  sigma_y:   0.02
  sigma_yaw: 0.005

association:
  chi2_gate: 16.27              # start loose (try 9.21 later for stricter gating)

# Landmark management
confirm_hits: 2                 # require 2 observations before turning blue
min_new_lm_dist: 0.35           # m, suppress new spawn if near an existing landmark
merge_R_scale: 4.0              # inflate R when merging near-duplicates

measurement_noise_inflate:
  range: 1.0
  bearing: 1.0

publish_rates_hz:
  viz: 15

sensor:
  lidar_rate_hz: 10
  lidar_angles: [-3.14, 3.14]
