# ============================
# Lean FastSLAM 2.0 Configuration
# ============================

frames:
  map_frame:   "odom"
  odom_frame:  "odom"
  base_frame:  "base_footprint"
  lidar_frame: "lidar"

odometry:
  use_ekf: false
  truth_topic: "/odom"
  ekf_topic: "/qcar/ekf/odom"

# Initialize particles
seed_from_params: true
overwrite_with_odom_on_first_msg: false
init:
  x: -4.3
  y: 3.0
  yaw: -3.14
initial_spread:
  x: 0.06
  y: 0.06
  yaw: 0.015
odom_buffer_window_sec: 2.0

# Particle filter
particles: 120
resample_neff_ratio: 0.5

# Process noise
motion_noise:
  sigma_x:   0.06
  sigma_y:   0.06
  sigma_yaw: 0.02

# Data association
association:
  mode: "nn_rb"          # "id" | "nn_rb"
  chi2_gate_rb: 3.91     # 2.3 (90%) | 3.91 (95%) | 5.99 (99%) | 9.21 (99.9%)

# Landmark behavior
landmarks:
  init_var: 0.02
  confirm_hits: 3
  lock_hits: 20
  lock_cov_trace: 0.0005

pose_proposal:
  enable: true
  Kmax: 12
  eps_fd: 1.0e-4
  clamp_dx: 0.5
  clamp_dy: 0.5
  clamp_dyaw: 0.1    # radians
  min_dt: 0.02
  prior_scale: 10.0


# --- Visualization (minimal & fast — single combined topic with namespaces) ---
visualization:
  topic: /slam/map_markers

  all:
    ns: landmarks_all
    sphere_diam: 0.1
    z_offset: 0.1
    rgba: [1.0, 0.5, 0.0, 1.0]     # orange

  confirmed:
    ns: landmarks_confirmed
    sphere_diam: 0.15
    z_offset: 0.1
    rgba: [0.0, 0.0, 1.0, 1.0]     # blue

  locked:
    ns: landmarks_locked
    sphere_diam: 0.2
    z_offset: 0.05
    rgba: [0.0, 1.0, 1.0, 1.0]     # cyan

  unmatched:
    ns: landmarks_unmatched
    sphere_diam: 0.1
    z_offset: 0.1
    rgba: [1.0, 0.0, 0.0, 1.0]     # red
