# ============================================
# FastSLAM 2.0 Configuration - Block 5 Fixed
# ============================================

# Core algorithm parameters
particles: 120
resample_neff_ratio: 0.6
chi2_gate: 9.21
new_landmark_likelihood_min: 0.25

# Measurement noise (projected cartesian approx, m^2)
meas_noise_xy_x: 0.25
meas_noise_xy_y: 0.25

# Odom noise (linear m/s, yawrate rad/s) - FIXED: consistent naming
odom_v_std: 0.15
odom_yawrate_std: 0.20

# Frame definitions
map_frame:   "map"
odom_frame:  "odom"
base_frame:  "base_footprint"
lidar_frame: "lidar"

# LiDAR->base extrinsics (2D) - CHECK THESE VALUES!
lidar_to_base_x: 0.0
lidar_to_base_y: 0.0
lidar_to_base_yaw_deg: 0.0

# Topic names
tracked_topic: "/tracked_cones"
odom_topic:    "/ekf/odom"

# Publication topics
pub_particles:     "/slam/particles"
pub_landmarks:     "/map_markers"
pub_weights:       "/slam/weights"
pub_slam_odom:     "/slam/odom"        # ADDED: Robot pose estimate

# Penalty factors for robust operation
miss_in_fov_penalty: 0.5
color_mismatch_penalty: 0.7