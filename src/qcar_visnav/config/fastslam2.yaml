# ============================
# Lean FastSLAM 2.0 Configuration
# ============================

frames:
  map_frame:   "odom"
  odom_frame:  "odom"
  base_frame:  "base_footprint"
  lidar_frame: "lidar"

odometry:
  use_ekf: true
  truth_topic: "/odom"
  ekf_topic: "/qcar/ekf/odom"

# Initialize particles
seed_from_params: true
overwrite_with_odom_on_first_msg: false
init:
  x: -4.3
  y: 3.0
  yaw: -3.14
initial_spread:
  x: 0.06
  y: 0.06
  yaw: 0.015
odom_buffer_window_sec: 2.0

# Particle filter
particles: 80
resample_neff_ratio: 0.5

# Process noise
motion_noise:
  sigma_x:   0.04
  sigma_y:   0.04
  sigma_yaw: 0.01

# Data association
association:
  mode: "id"          # "id" | "nn_rb"
  chi2_gate_rb: 5.99

# Landmark behavior
landmarks:
  init_var: 0.30
  confirm_hits: 3
  lock_hits: 15
  lock_cov_trace: 0.01

# --- Visualization (minimal & fast — single combined topic with namespaces) ---
visualization:
  topic: /slam/map_markers

  all:
    ns: landmarks_all
    sphere_diam: 0.1
    z_offset: 0.1
    rgba: [1.0, 0.5, 0.0, 1.0]     # orange

  confirmed:
    ns: landmarks_confirmed
    sphere_diam: 0.15
    z_offset: 0.1
    rgba: [0.0, 0.0, 1.0, 1.0]     # blue

  locked:
    ns: landmarks_locked
    sphere_diam: 0.2
    z_offset: 0.05
    rgba: [0.0, 1.0, 1.0, 1.0]     # cyan

  unmatched:
    ns: landmarks_unmatched
    sphere_diam: 0.1
    z_offset: 0.1
    rgba: [1.0, 0.0, 0.0, 1.0]     # red
