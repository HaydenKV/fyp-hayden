# ============================
# FastSLAM 2.0 Configuration
# QCar Autonomous Vehicle SLAM
# ============================

# --- COORDINATE FRAMES ---
frames:
  map_frame: "odom"            # run entirely in ODOM (world-fixed frame for stability)
  odom_frame: "odom"
  base_frame: "base_footprint"
  lidar_frame: "lidar"

# --- ODOMETRY SOURCE SELECTION ---
odometry:
  use_ekf: false                    # false = use ground truth (/odom), true = use EKF (/qcar/ekf/odom)
  truth_topic: "/odom"              # Ground truth odometry from Gazebo
  ekf_topic: "/qcar/ekf/odom"       # EKF velocity estimates from your velocity EKF

# --- INITIAL POSE (spawn pose in simulation) ---
seed_from_params: true
overwrite_with_odom_on_first_msg: false
init:
  x:   -4.3
  y:    3.0
  yaw: -3.14
initial_spread:
  x:   0.1
  y:   0.1
  yaw: 0.05

# --- ODOMETRY INTERPRETATION ---
odom_buffer_window_sec: 3.0

# --- PARTICLE FILTER CORE PARAMETERS ---
particles: 120
resample_neff_ratio: 0.4

# --- MOTION MODEL PARAMETERS ---
motion_noise:
  sigma_x:   0.05
  sigma_y:   0.05
  sigma_yaw: 0.03

# --- DATA ASSOCIATION PARAMETERS ---
association:
  chi2_gate: 5.99     # Mahalanobis gate (95%)
  euclid_gate: 0.5    # Euclidean pre-gate in meters (Phase 2)

# --- LANDMARK MANAGEMENT ---
confirm_hits: 4
min_new_lm_dist: 0.21
merge_R_scale: 7.0
landmark_prior_var: 0.12

# --- LANDMARK LIFECYCLE / PRUNING (Phase 2) ---
landmarks:
  prune_unconfirmed_misses: 8   # delete unconfirmed after 8 misses
  prune_stale_misses: 25        # delete any landmark after 25 misses
  unconfirmed_R_scale: 2.0      # inflate R for unconfirmed landmarks


