# ============================
# FastSLAM 2.0 Configuration
# QCar Autonomous Vehicle SLAM
# ============================

# --- COORDINATE FRAMES ---
frames:
  map_frame: "odom"            # run in odom frame
  odom_frame: "odom"
  base_frame: "base_footprint"
  lidar_frame: "lidar"

# --- ODOMETRY SOURCE SELECTION ---
odometry:
  use_ekf: false               # false: /odom, true: /qcar/ekf/odom
  truth_topic: "/odom"
  ekf_topic: "/qcar/ekf/odom"

# --- INITIAL POSE (spawn pose in simulation) ---
seed_from_params: true
overwrite_with_odom_on_first_msg: false
init:
  x:   -4.3
  y:    3.0
  yaw: -3.14
initial_spread:
  x:   0.05
  y:   0.05
  yaw: 0.03

# --- ODOMETRY BUFFER ---
odom_buffer_window_sec: 2.0

# --- PARTICLE FILTER ---
particles: 60
resample_neff_ratio: 0.5

# --- MOTION MODEL ---
motion_noise:
  sigma_x:   0.05
  sigma_y:   0.05
  sigma_yaw: 0.03

# --- DATA ASSOCIATION (RB) ---
association:
  chi2_gate: 7.38            # RB χ² (95%)
  chi2_gate_world: 7.38      # world χ² (merge-before-birth)
  euclid_gate: 0.5           # reserved (not used now)

# --- LANDMARK MANAGEMENT ---
confirm_hits: 2
min_new_lm_dist: 0.3         # retained for completeness
merge_R_scale: 5.0           # retained for completeness
landmark_prior_var: 0.08

landmarks:
  prune_unconfirmed_misses: 10   # reserved (not used now)
  prune_stale_misses: 40         # reserved (not used now)
  unconfirmed_R_scale: 2.5

# --- BIRTH BUFFER ---
birth:
  required_hits: 3
  max_age: 10
  promote_radius: 0.30

# --- POSE PROPOSAL ---
proposal:
  max_sigma_trace: 0.30
  sample_every_k: 0             # 0 = deterministic mean only

# --- WEIGHT PENALTIES ---
weight:
  new_landmark_penalty: 1.0
  fov_miss_penalty: 0.4

# --- SENSOR FOV (for FoV-miss penalty only) ---
sensor:
  fov_range_max: 20.0
  fov_bearing_deg: 90.0

# --- LAP CONTROL ---
lap:
  freeze_after_first_loop: false
