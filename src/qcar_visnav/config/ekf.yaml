# Minimal 6-State Velocity EKF Configuration
# State: [vx, vy, r, bg, bax, bay]

# Topics
imu_topic: "/imu"
joint_states_topic: "/qcar/joint_states"
odom_topic: "/qcar/ekf/odom"

# Frames
odom_frame: "odom"
base_frame: "base_link"

# Measurement noise (standard deviations)
gyro_std: 0.01    # Gyro noise (rad/s)
speed_std: 0.01   # Speed measurement noise (m/s)

# Vehicle parameters
wheelbase: 0.258  # QCar wheelbase (m)
rw: 0.033        # Wheel radius (m)
dtMaxEst: 0.01   # Max time step (s)

# Process noise for [vx, vy, r, bg, bax, bay]
q: [2.0, 2.0, 1.0, 0.001, 0.01, 0.01]