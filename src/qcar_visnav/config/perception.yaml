detection:
  mode: "clustering"          # "clustering" | "circular_hough"

lidar:
  min_range: 0.3
  max_range: 15.0

seg:
  tau0: 0.12                  # meters
  tau_alpha: 0.03             # meters per meter

cluster:
  eps: 0.20                   # meters
  min_cluster_size: 3
  max_cluster_size: 50

noise:
  sigma_r: 0.07               # meters
  sigma_theta_deg: 0.8        # degrees

topics:
  lidar: "/scan"
  cones: "/cones"
frame:
  lidar: "lidar"

debug_print: 1


