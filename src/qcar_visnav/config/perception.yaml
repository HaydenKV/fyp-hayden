# =======================
# Perception + Tracking
# =======================

cone_detector:
  detection: { mode: "clustering" }
  lidar:     { min_range: 0.3, max_range: 17.0 }
  seg:       { tau0: 0.12, tau_alpha: 0.03 }
  cluster:   { eps: 0.25, min_cluster_size: 2, max_cluster_size: 40 }
  noise:     { sigma_r: 0.07, sigma_theta_deg: 0.8 }
  topics:    { lidar: "/scan", cones: "/cones" }
  frame:     { lidar: "" }
  # legacy flat keys (kept for node)
  lidar_topic: "/scan"
  cones_topic: "/cones"
  lidar_frame: ""
  debug_print: 1

cone_tracker:
  detections_topic: "/cones"
  tracks_topic:     "/tracked_cones"
  odom_frame:  "odom"
  base_frame:  "base_footprint"
  gate_chi2:   7.38
  init_hits:   2
  max_misses:  8
  init_cov:    0.25
  q_xy:        0.03
  r_scale:     1.1
  tf_use_latest: true
  debug: 1

# ----- Colour classifier node (multi-CSI) -----
cone_colour:
  detections_topic: "/tracked_cones"
  output_topic:     "/cones_colored"

  # Front / Left / Right image + camera info topics
  rgb_topic_front:  "/csi_front/image_raw"
  rgb_topic_left:   "/csi_left/image_raw"
  rgb_topic_right:  "/csi_right/image_raw"

  cam_info_front:   "/csi_front/camera_info"
  cam_info_left:    "/csi_left/camera_info"
  cam_info_right:   "/csi_right/camera_info"

  # Camera frames (must exist in TF)
  camera_frame_front: "csi_front_optical"
  camera_frame_left:  "csi_left_optical"
  camera_frame_right: "csi_right_optical"

  # ROI sizing and timing
  max_image_age_s:  0.25
  cone_width_m:     0.25
  min_roi_px:       16
  max_roi_px:       96
  min_pixels_for_conf: 120
  conf_floor:       0.10

  # HSV thresholds (tune if needed)
  hsv_blue_low:     [100, 150, 50]
  hsv_blue_high:    [130, 255, 255]
  hsv_yellow_low:   [18, 80, 80]
  hsv_yellow_high:  [35, 255, 255]

  # Debug overlays
  debug:            1
  debug_publish_image: true
